                        LookUp(colUserAnswers, QuestionId = ThisItem.id).SelectedKey = ThisItem.correct,
                        RGBA(34, 197, 94, 1),
                        RGBA(239, 68, 68, 1)
                    )
                  DisabledFill: |-
                    =If(
                        LookUp(colUserAnswers, QuestionId = ThisItem.id).SelectedKey = ThisItem.correct,
                        RGBA(240, 253, 244, 0.5),
                        RGBA(254, 242, 242, 0.5)

Screens:
  QuyTacUngXu_KiemTra:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      LoadingSpinnerColor: =RGBA(56, 0, 209, 1)
      OnVisible: |-
        =// 1. Xác định chủ đề cần làm bài (mặc định 'COC')
        UpdateContext({
            locActiveTopic: Coalesce(varSelectedChuDe, "COC")
        });

        // 2. Tải toàn bộ câu hỏi đang có trạng thái 'Hiện' của chủ đề từ SharePoint
        ClearCollect(
            colRawQuestions,
            Sort(
                Filter(
                    'APP CHẤM CÔNG - NGAN HANG CAU HOI',
                    CHUDE = locActiveTopic && TRANG_THAI.Value = "Hiện"
                ),
                THU_TU,
                SortOrder.Ascending
            )
        );

        // 3. Nếu không tải được câu hỏi -> Dừng và quay về Hub ngay lập tức
        If(
            IsEmpty(colRawQuestions),
            Notify("Không có câu hỏi nào đang được kích hoạt cho chủ đề này.", NotificationType.Warning);
            Navigate(QuyTacUngXu_Hub, ScreenTransition.Fade)
        );

        // 4. Chuẩn hóa dữ liệu sang bộ nhớ phiên làm bài (colQuizSession)
        ClearCollect(
            colQuizSession,
            ForAll(
                colRawQuestions,
                {
                    id: Title,
                    chuDe: CHUDE,
                    tenChuDe: Coalesce(TEN_CHU_DE, "BÀI KIỂM TRA " & CHUDE),
                    question: NOI_DUNG_CAU_HOI,
                    optA: DAPAN_A,
                    optB: DAPAN_B,
                    optC: DAPAN_C,
                    optD: DAPAN_D,
                    correct: DAPAN_DUNG,
                    required: Coalesce(CAU_BAT_BUOC, false),
                    risk: Coalesce(MUC_DO_RUI_RO, "Tiêu chuẩn"),
                    group: Coalesce(NHOM_CAU_HOI, "Tình huống"),
                    explanation: Coalesce(GIAI_THICH, ""),
                    basis: Coalesce(CAN_CU, ""),
                    sortOrder: Coalesce(THU_TU, 1),
                    totalQuestions: CountRows(colRawQuestions),
                    durationMinutes: Coalesce(THOI_GIAN_PHUT, 15),
                    passScore: Coalesce(DIEM_DAT, 7)
                }
            )
        );

        // 5. Khởi tạo trạng thái phiên làm bài (Không tính giờ)
        Clear(colUserAnswers);
        UpdateContext({
            locCurrentQIndex: 1,
            locQuizTotalCount: CountRows(colQuizSession),
            locQuizCompleted: false,
            locQuizScore: 0,
            locQuizPassed: false,
            locMandatoryPassed: true,
            locSubmitting: false
        })
    Children:
      # --- TOP BAR (WHITE EDITORIAL STYLE) ---
      - RectTopBar_Quiz:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(226, 232, 240, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =75
            Width: =Parent.Width

      # --- SVG BACK BUTTON (NO TEXT '<') ---
      - ImgBack_Quiz:
          Control: Image@2.1.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Height: =24
            Image: |
              ="data:image/svg+xml;utf8," & EncodeUrl("<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%233800D1' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='15 18 9 12 15 6'></polyline></svg>")
            OnSelect: =Navigate(QuyTacUngXu_Hub, ScreenTransition.Fade)
            Width: =24
            X: =20
            Y: =26

      - BtnBackOverlay_Quiz:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(0, 0, 0, 0)
            DisabledFill: =RGBA(0, 0, 0, 0)
            Fill: =RGBA(0, 0, 0, 0)
            Height: =46
            HoverColor: =RGBA(0, 0, 0, 0)
            HoverFill: =RGBA(56, 0, 209, 0.08)
            OnSelect: =Navigate(QuyTacUngXu_Hub, ScreenTransition.Fade)
            PressedColor: =RGBA(0, 0, 0, 0)
            PressedFill: =RGBA(56, 0, 209, 0.15)
            RadiusBottomLeft: =12
            RadiusBottomRight: =12
            RadiusTopLeft: =12
            RadiusTopRight: =12
            Text: =""
            Width: =46
            X: =9
            Y: =15

      - LblTopTitle_Quiz:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(56, 0, 209, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =50

            Size: =13
            Text: |-
              =If(locCurrentQIndex < locQuizTotalCount, "Câu tiếp theo >", "Nộp bài (" & CountRows(colUserAnswers) & "/" & locQuizTotalCount & ")")
            Width: =400
            X: =210
            Y: =560

      # Hidden final submit button triggered on last question
      - BtnSubmitFinal_Quiz:
          Control: Classic/Button@2.2.0
          Properties:
            Height: =0
            OnSelect: |-
              =UpdateContext({
                  locQuizScore: CountRows(Filter(colUserAnswers, IsCorrect = true)),
                  locMandatoryFailedCount: CountRows(Filter(colUserAnswers, IsRequired = true && IsCorrect = false))
              });
              UpdateContext({
                  locQuizPassed: (locQuizScore >= First(colQuizSession).passScore) && (locMandatoryFailedCount = 0),
                  locQuizCompleted: true
              });
              Patch(
                  'APP CHẤM CÔNG - KET QUA KIEM TRA',
                  Defaults('APP CHẤM CÔNG - KET QUA KIEM TRA'),
                  {
                      Title: "KT-" & locActiveTopic & "-" & _userRecord.MSNV.Value & "-" & Text(Now(), "yyyymmddhhmmss"),
                      CHUDE: locActiveTopic,
                      MANHANVIEN: _userRecord.MSNV.Value,
                      HOVATEN: _userRecord.HOTEN.Value,
                      DONVI_MUCTIEU: Coalesce(_userRecord.MUCTIEU.Value, "Hội đồng Điều hành"),
                      NGAYNOP: Now(),
                      DIEMSO: locQuizScore,
                      SO_CAU_BAT_BUOC_DUNG: CountRows(Filter(colUserAnswers, IsRequired = true && IsCorrect = true)),
                      KETQUA: If((locQuizScore >= First(colQuizSession).passScore) && (locMandatoryFailedCount = 0), "ĐẠT", "KHÔNG ĐẠT"),
                      THOI_GIAN_LAM_GIAY: 0,
                      CHI_TIET_DAP_AN: JSON(colUserAnswers)
                  }
              )
            Visible: =false
            Width: =0
            X: =0
            Y: =0


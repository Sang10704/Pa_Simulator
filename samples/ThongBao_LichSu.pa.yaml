          Properties:
            BorderColor: =RGBA(109, 109, 109, 1)
            Height: =773
            Items: |-
              =Filter(
                  colRecentNotifications,
                  (
                      Coalesce(LoaiThongBao.Value, LoaiThongBao.Value) = "Hệ thống" Or 
                      NguoiNhan = "ALL" Or 
                      NguoiNhan = Text(_userRecord.MSNV.Value) Or 
                      "," & Text(_userRecord.MSNV.Value) & "," in ("," & Substitute(Substitute(NguoiNhan, " ", ""), ";", ",") & ",")
                  ),
                  (
                      locTabThongBao = "Tất cả" Or 
                      Coalesce(LoaiThongBao.Value, LoaiThongBao.Value) = locTabThongBao
                  ),
                  (
                      IsBlank(ThoiGianHienThi) Or 
                      ThoiGianHienThi <= Now()

Screens:
  ThongBao_LichSu:
    Properties:
      Fill: =RGBA(237, 237, 237, 1)
      LoadingSpinnerColor: =RGBA(255, 200, 61, 1)
      OnVisible: |-
        =UpdateContext({locTabThongBao: "Tất cả"});

        // Khởi tạo và nạp dữ liệu cache lịch sử đã đọc
        If(
        IsEmpty(colDaDocHistory),
        ClearCollect(colDaDocHistory, { ID: 0 });
        Clear(colDaDocHistory);
        LoadData(colDaDocHistory, "LocalNotiHistory", true)
        );

        // Tải thông báo 90 ngày gần nhất từ SharePoint (Vượt qua giới hạn 5000 dòng nhờ lọc Created delegable)
        UpdateContext({ varNotiCutoffDate: DateAdd(Today(), -90, TimeUnit.Days) });
        ClearCollect(
        colRecentNotifications,
        Sort(
        Filter(
        'APP CHẤM CÔNG - THÔNG BÁO',
        Created >= varNotiCutoffDate
        ),
        Created,
        SortOrder.Descending
        )
        );

            Height: =47
            Italic: =true
            Size: =13
            Text: "=With(\r\n    {\r\n        // 1. Lấy giờ hiện tại và quay số ngẫu nhiên từ 1 đến 3\r\n        gioHienTai: Hour(Now()),\r\n        soNgauNhien: RandBetween(1, 3)\r\n    },\r\n    // 2. Dựa vào giờ để đưa ra danh sách câu, sau đó dùng số ngẫu nhiên để bốc ra 1 câu\r\n    If(\r\n        gioHienTai < 12,\r\n        Index(\r\n            [\r\n                \"☀️ Chào buổi sáng! Chúc bạn ngày mới đầy năng lượng \U0001F604\",\r\n                \"☕ Một buổi sáng làm việc hiệu quả và suôn sẻ nhé!\",\r\n                \"\U0001F340 Bắt đầu ngày mới với nụ cười thật tươi nào!\"\r\n            ], \r\n            soNgauNhien\r\n        ).Value,\r\n        \r\n        gioHienTai < 18,\r\n        Index(\r\n            [\r\n                \"\U0001F324️ Chúc bạn một buổi chiều làm việc thật năng suất \U0001F604\",\r\n                \"\U0001F4AA Cố lên nào, sắp hoàn thành công việc của ngày rồi!\",\r\n                \"☕ Nhớ nghỉ ngơi một chút và uống đủ nước nhé!\"\r\n            ], \r\n            soNgauNhien\r\n        ).Value,\r\n        \r\n        // Từ 18h trở đi (Buổi tối)\r\n        Index(\r\n            [\r\n                \"\U0001F319 Một ngày vất vả rồi, chúc bạn buổi tối thư giãn \U0001F604\",\r\n                \"✨ Gác lại âu lo, tận hưởng buổi tối thật vui vẻ nhé!\",\r\n                \"\U0001F31F Chúc bạn có một buổi tối ấm áp bên gia đình!\"\r\n            ], \r\n            soNgauNhien\r\n        ).Value\r\n    )\r\n)"
            Width: =500

Screens:
  TrangChu:
    Properties:
      Fill: =RGBA(245, 245, 245, 1)
      LoadingSpinnerColor: =RGBA(255, 200, 61, 1)
      OnVisible: |-
        =// B1: Ép điện thoại lấy tọa độ mới nhất và kiểm tra độ chính xác
        UpdateContext({locIsLoading: true});

        // Kiểm tra nếu GPS chưa sẵn sàng thì báo nhân viên đợi 1-2 giây
        If(
            Location.Latitude = 0,
            Notify("Hệ thống đang xác định vị trí của bạn, vui lòng đợi trong giây lát...", NotificationType.Warning);
            UpdateContext({locIsLoading: false}),

            // Nếu đã có tọa độ thì bắt đầu tính
            Set(varMyLat, Location.Latitude);
            Set(varMyLon, Location.Longitude);

            // B2: Tải và lọc danh sách (Chỉ lấy dòng có đủ Latitude và Longitude)
            ClearCollect(
                colDanhSachMucTieu_Appchamcong, 
                Filter(
                    MASTERLOCATION, 
                    !IsBlank(Latitude) And !IsBlank(Longitude)
                )
            );

            // B3 & B4: Tính toán khoảng cách
            ClearCollect(
                colMucTieuDaTinhKhoangCach_Appchamcong,
                AddColumns(
                    colDanhSachMucTieu_Appchamcong,
                    KhoangCachThucTe_Appchamcong,
                    // Kiểm tra nếu vị trí hiện tại hợp lệ mới tính, không thì trả về 0
                    If(varMyLat <> 0 And varMyLon <> 0,
                        Sqrt(
                            Power(Value(Substitute(Text(Latitude), ",", "."), "en-US") - varMyLat, 2) + 
                            Power(Value(Substitute(Text(Longitude), ",", "."), "en-US") - varMyLon, 2)
                        ) * 111320,
                        0
                    )
                )
            );

            // B4 (MỚI): Lấy TẤT CẢ mục tiêu nằm trong bán kính cho phép thay vì chỉ lấy 1 cái
            ClearCollect(
                colMucTieuTrongBanKinh,
                Sort(
                    Filter(
                        colMucTieuDaTinhKhoangCach_Appchamcong, 
                        KhoangCachThucTe_Appchamcong <= Value('Bán kính cho phép')
                    ),
                    KhoangCachThucTe_Appchamcong,
                    SortOrder.Ascending
                )
            );

            // B5 (MỚI): Xử lý kết quả thông báo dựa trên số lượng mục tiêu tìm thấy
            If(
                IsEmpty(colMucTieuTrongBanKinh),
                // Trạng thái 1: Không có cái nào trong bán kính
                Notify("Bạn đang ở xa mục tiêu (" & Round(Min(colMucTieuDaTinhKhoangCach_Appchamcong, KhoangCachThucTe_Appchamcong),0) & "m). Vui lòng di chuyển vào đúng vị trí!", NotificationType.Error),

                // Trạng thái 2: Có 1 hoặc nhiều mục tiêu trong bán kính
                If(
                    CountRows(colMucTieuTrongBanKinh) = 1,
                    Notify("Đã xác định mục tiêu: " & First(colMucTieuTrongBanKinh).TenMucTieu, NotificationType.Success),
                    Notify("Phát hiện nhiều mục tiêu gần bạn. Vui lòng chọn mục tiêu chính xác ở ô bên dưới!", NotificationType.Information)
                )
            );

            UpdateContext({locIsLoading: false})
        );


        //B7: 1. Tìm đúng 1 bản ghi MỚI NHẤT của nhân viên 
        // Tìm log cuối cùng
        Set(varLogTuyetDoi, 
            First(
                Sort(
                    Filter('APP CHẤM CÔNG - LOG CHECKIN/CHECKOUT', 'SỐ HIỆU' = _userRecord.MSNV.Value), 
                    'THỜI GIAN', 
                    SortOrder.Descending
                )
            )
        );

        // Áp dụng luật reset thông minh
        Set(varLogMoiNhat,
            If(
                IsBlank(varLogTuyetDoi), 
                Blank(),

                // LUẬT 1: Nếu trạng thái gần nhất là CHECK-IN
                varLogTuyetDoi.'TRẠNG THÁI'.Value = "CHECK-IN",
                If(
                    // Kiểm tra xem lượt Check-in này có phải từ ngày hôm trước trở đi không
                    DateValue(Text(varLogTuyetDoi.'THỜI GIAN')) < Today() And 
                    (
                        // Điều kiện A: Đã qua 24 tiếng kể từ lúc Check-in
                        DateDiff(varLogTuyetDoi.'THỜI GIAN', Now(), TimeUnit.Hours) >= 24 Or 

                        // Điều kiện B: Đã qua mốc 7h15p sáng ngày hôm nay
                        Hour(Now()) > 7 Or 
                        (Hour(Now()) = 7 And Minute(Now()) >= 15)
                    ),
                    // Nếu thỏa mãn -> Reset trạng thái về Blank (cho phép vào ca ngày mới)
                    Blank(),
                    // Nếu chưa thỏa mãn (vẫn trong ca đêm qua) -> Giữ lại log Check-in để tiếp tục cho phép Check-out
                    varLogTuyetDoi
                ),

                // LUẬT 2: Nếu trạng thái gần nhất là CHECK-OUT
                varLogTuyetDoi.'TRẠNG THÁI'.Value = "CHECK-OUT",
                If(
                    // Chỉ giữ lại trạng thái CHECK-OUT nếu nó diễn ra trong NGÀY HÔM NAY
                    DateValue(Text(varLogTuyetDoi.'THỜI GIAN')) = Today(),
                    varLogTuyetDoi,

                    // Nếu Check-out từ ngày hôm trước -> Reset về Blank ngay khi sang ngày mới (từ 00h00 trở đi)
                    Blank()
                ),

                // Dự phòng các trường hợp khác
                Blank()
            )
        );

        // gán trạng thái để hiển thị đúng nút vào ca , ra ca
        Set(varTrangThaiHienTai, If(!IsBlank(varLogMoiNhat), varLogMoiNhat.'TRẠNG THÁI'.Value, "CHECK-OUT"));

        // 2. Bắt đầu ghép cặp Giờ Vào / Giờ Ra
        If(
            varLogMoiNhat.'TRẠNG THÁI'.Value = "CHECK-IN",

            // Trường hợp A: Nhân viên đang TRONG CA
            Set(varGioVao, varLogMoiNhat);
            Set(varGioRa, Blank()),

            // Trường hợp B: Nhân viên ĐÃ RA CA 
            // (Giờ ra là log mới nhất, Giờ vào phải là log CHECK-IN liền kề trước đó)
            Set(varGioRa, varLogMoiNhat);
            Set(varGioVao, 
                First(
                    Sort(
                        Filter('APP CHẤM CÔNG - LOG CHECKIN/CHECKOUT', 
                            'SỐ HIỆU' = _userRecord.MSNV.Value && 
                            'TRẠNG THÁI'.Value = "CHECK-IN" && 
                            'THỜI GIAN' <= varGioRa.'THỜI GIAN'
                        ), 
                        'THỜI GIAN', 
                        SortOrder.Descending
                    )
                )
            )
        );
        // ===== KIỂM TRA THÔNG BÁO NỔI & TẢI THÔNG BÁO GẦN ĐÂY (VƯỢT GIỚI HẠN 5000 DÒNG QUA CỘT CREATED) =====
        UpdateContext({ locShowPopupNoti: false, locNotiHienTai: Blank() });

        // 1. Nạp lại cache lịch sử đã đọc từ máy
        LoadData(colDaDocHistory, "LocalNotiHistory", true);

        // 2. Tải thông báo 14 ngày gần nhất từ SharePoint (Ủy quyền 100% trên cột Created, lấy trọn vẹn ID mới nhất như 5307)
        UpdateContext({ varNotiCutoffDateHome: DateAdd(Today(), -14, TimeUnit.Days) });
        ClearCollect(
            colRecentNotificationsHome,
            Sort(
                Filter(
                    'APP CHẤM CÔNG - THÔNG BÁO',
                    Created >= varNotiCutoffDateHome
                ),
                Created,
                SortOrder.Descending
            )
        );

        // 3. Tra cứu thông báo nổi MỚI NHẤT hợp lệ cho người dùng hiện tại từ tập dữ liệu vừa tải
        UpdateContext({
            locNotiHienTai: First(
                Filter(
                    colRecentNotificationsHome,
                    HienThiNoi.Value = "Hiện" &&
                    (
                        LoaiThongBao.Value = "Hệ thống" ||
                        NguoiNhan = _userRecord.MSNV.Value ||
                        NguoiNhan = "ALL" ||
                        ("," & _userRecord.MSNV.Value & "," in NguoiNhan)
                    ) &&
                    !(ID in colDaDocHistory.ID) &&
                    (IsBlank(ThoiGianHienThi) || ThoiGianHienThi <= Now()) &&
                    (IsBlank(ThoiGianHetHan) || ThoiGianHetHan >= Now())
                )
            )
        });

        // 4. Nếu có thông báo nổi thì bật popup
        If(
            !IsBlank(locNotiHienTai),
            UpdateContext({ locShowPopupNoti: true })
        );
        // KIỂM TRA CẢNH BÁO HOÀN TẤT NGHỈ VIỆC 01.QT-MB.02
        With(
            {
                // BƯỚC 1: Lấy đúng ĐƠN NGHỈ VIỆC MỚI NHẤT của nhân viên (theo ngày tạo Created)
                _donMoiNhat: First(
                    Sort(
                        Filter(
                            'APP CHẤM CÔNG - ĐĂNG KÍ NGHỈ VIỆC',
                            'MÃ NV' = _userRecord.MSNV.Value
                        ),
                        Created,
                        SortOrder.Descending
                    )
                )
            },
            If(
                // BƯỚC 2: Kiểm tra nghiêm ngặt đơn MỚI NHẤT:
                // Phải có trạng thái "ĐÃ DUYỆT", KHÔNG bị Từ Chối/Hủy ở bất kỳ cấp nào
                !IsBlank(_donMoiNhat) &&
                _donMoiNhat.'TRẠNG THÁI'.Value = "ĐÃ DUYỆT" &&
                _donMoiNhat.'TRẠNG THÁI'.Value <> "TỪ CHỐI" &&
                _donMoiNhat.'TRẠNG THÁI'.Value <> "ĐÃ HỦY" &&
                _donMoiNhat.'PHÊ DUYỆT CẤP 1'.Value <> "TỪ CHỐI" &&
                _donMoiNhat.'PHÊ DUYỆT CẤP 2'.Value <> "TỪ CHỐI" &&
                _donMoiNhat.'PHÊ DUYỆT CẤP 3'.Value <> "TỪ CHỐI" &&
                _donMoiNhat.'PHÊ DUYỆT CẤP 4'.Value <> "TỪ CHỐI" &&
                _donMoiNhat.'TRẠNG THÁI NGHỈ'.Value in [
                    "Nghỉ theo đơn",
                    "Nghỉ trước thời hạn đơn",
                    "Bỏ việc/Bỏ ca ngày 5"
                ] &&
                DateValue(Text(_donMoiNhat.'NGÀY NGHỈ VIỆC')) >= Today(),

                // BƯỚC 3: Nếu đúng là đơn ĐÃ DUYỆT hợp lệ -> Tiến hành tính hạn 3 ngày làm việc
                With(
                    {
                        _ngayNghi: DateValue(Text(_donMoiNhat.'NGÀY NGHỈ VIỆC')),
                        _ngayBaoTruoc3Ngay: Switch(
                            Weekday(DateValue(Text(_donMoiNhat.'NGÀY NGHỈ VIỆC'))),
                            1, DateAdd(DateValue(Text(_donMoiNhat.'NGÀY NGHỈ VIỆC')), -4, TimeUnit.Days),
                            2, DateAdd(DateValue(Text(_donMoiNhat.'NGÀY NGHỈ VIỆC')), -5, TimeUnit.Days),
                            3, DateAdd(DateValue(Text(_donMoiNhat.'NGÀY NGHỈ VIỆC')), -5, TimeUnit.Days),
                            4, DateAdd(DateValue(Text(_donMoiNhat.'NGÀY NGHỈ VIỆC')), -5, TimeUnit.Days),
                            DateAdd(DateValue(Text(_donMoiNhat.'NGÀY NGHỈ VIỆC')), -3, TimeUnit.Days)
                        )
                    },
                    If(
                        Today() >= _ngayBaoTruoc3Ngay,
                        UpdateContext({
                            varDonNghiViecWarning: _donMoiNhat,
                            varShowPopupWarningChiTiet: true   // Đến hạn 3 ngày -> Bật nổi Popup
                        }),
                        UpdateContext({
                            varDonNghiViecWarning: Blank(),
                            varShowPopupWarningChiTiet: false  // Chưa đến hạn -> Ẩn toàn bộ
                        })
                    )
                ),

                // TRƯỜNG HỢP: ĐƠN BỊ TỪ CHỐI / ĐÃ HỦY / CHƯA DUYỆT XONG -> XÓA BIẾN VÀ TẮT HOÀN TOÀN
                UpdateContext({
                    varDonNghiViecWarning: Blank(),
                    varShowPopupWarningChiTiet: false
                })
            )

        );
        // TỰ ĐỘNG NẠP CÁC BÀI KIỂM TRA / KHẢO SÁT MỚI NHẤT TỪ SHAREPOINT CHO BĂNG CHUYỀN TRANG CHỦ
        ClearCollect(
            colActiveQuestionsHome,
            Filter(
                'APP CHẤM CÔNG - NGAN HANG CAU HOI',
                TRANG_THAI.Value = "Hiện" 
            )
        );

        ClearCollect(
            colActiveTopicsHome,
            Distinct(colActiveQuestionsHome, CHUDE)
        );

        ClearCollect(
            colUserExamHistoryHome,
            Filter(
                'APP CHẤM CÔNG - KET QUA KIEM TRA',
                MANHANVIEN = _userRecord.MSNV.Value
            )
        );

        UpdateContext({
            varUserCocSignedHome: LookUp(
                'APP CHẤM CÔNG - CAM KẾT TUÂN THỦ COC',
                MANHANVIEN = _userRecord.MSNV.Value && PHIENBAN = "SZ-GOV-COC-01"
            )
        });

        Clear(colHomeExamAlerts);

        // 1. Thêm thẻ Ký Cam kết Phụ lục 04 nếu chủ đề COC đang kích hoạt
        If(
            !IsEmpty(Filter(colActiveTopicsHome, Value = "COC")),
            Collect(
                colHomeExamAlerts,
                {
                    AlertId: "COC_COMMIT",
                    ChuDeCode: "COC",
                    Tag: "VĂN BẢN QUY CHẾ",
                    TimeTag: "Phụ lục 04",
                    Title: "1. Đọc & Ký Cam kết Tuân thủ COC",
                    Desc: "Nghiên cứu 5 chương quy tắc ứng xử, các lằn ranh đỏ (Red Lines) và thực hiện ký cam kết điện tử theo QĐ 382/2026/QĐ-SEAZEN.",
                    StatusText: If(!IsBlank(varUserCocSignedHome), "● Đã ký cam kết", "● Chưa ký cam kết"),
                    StatusColor: If(!IsBlank(varUserCocSignedHome), RGBA(22, 101, 52, 1), RGBA(217, 119, 6, 1)),
                    ActionText: If(!IsBlank(varUserCocSignedHome), "Xem lại", "Đọc & Ký ngay"),
                    ScreenTarget: "DOC_VA_KY",
                    Priority: If(!IsBlank(varUserCocSignedHome), 3, 1)
                }
            )
        );

        // 2. Thêm từng bài kiểm tra của các chủ đề đang mở trên SharePoint
        ForAll(
            colActiveTopicsHome As _topic,
            With(
                {
                    topicCode: _topic.Value,
                    topicQuestions: Filter(colActiveQuestionsHome, CHUDE = _topic.Value),
                    userPassedAttempts: Filter(colUserExamHistoryHome, CHUDE = _topic.Value && KETQUA = "ĐẠT"),
                    userAllAttempts: Filter(colUserExamHistoryHome, CHUDE = _topic.Value)
                },
                With(
                    {
                        firstQ: First(topicQuestions),
                        qCount: CountRows(topicQuestions),
                        userBestRecord: First(
                            Sort(
                                If(!IsEmpty(userPassedAttempts), userPassedAttempts, userAllAttempts),
                                DIEMSO,
                                SortOrder.Descending
                            )
                        ),
                        hasPassed: !IsEmpty(userPassedAttempts),
                        hasAttempted: !IsEmpty(userAllAttempts)
                    },
                    With(
                        {
                            passScore: Coalesce(firstQ.DIEM_DAT, 7),
                            durationMin: Coalesce(firstQ.THOI_GIAN_PHUT, 15),
                            topicTitle: Coalesce(firstQ.TEN_CHU_DE, "Bài Kiểm tra " & topicCode),
                            topicDesc: Coalesce(firstQ.MO_TA_CHU_DE, "Trắc nghiệm nhận thức & tình huống chuyên môn theo quy chế.")
                        },
                        Collect(
                            colHomeExamAlerts,
                            {
                                AlertId: "EXAM_" & topicCode,
                                ChuDeCode: topicCode,
                                Tag: "KHẢO SÁT HIỂU BIẾT (" & topicCode & ")",
                                TimeTag: qCount & " câu • " & durationMin & " phút",
                                Title: If(topicCode = "COC", "2. " & topicTitle, topicTitle),
                                Desc: topicDesc,
                                StatusText: If(
                                    hasPassed,
                                    "● Đã đạt: " & userBestRecord.DIEMSO & "/" & qCount & " điểm",
                                    If(hasAttempted, "● Chưa đạt (" & userBestRecord.DIEMSO & "/" & qCount & ") - Làm lại", "● Chưa làm bài")
                                ),
                                StatusColor: If(
                                    hasPassed,
                                    RGBA(22, 101, 52, 1),
                                    If(hasAttempted, RGBA(225, 29, 72, 1), RGBA(217, 119, 6, 1))
                                ),
                                ActionText: If(hasPassed, "Xem lại", If(hasAttempted, "Làm lại ngay", "Làm bài ngay")),
                                ScreenTarget: "KIEM_TRA",
                                Priority: If(hasPassed, 3, If(hasAttempted, 2, 1))
                            }
                        )
                    )
                )
            )
        );

        // 3. Sắp xếp ưu tiên: Chưa xong / Chưa làm lên đầu hàng
        ClearCollect(
            colHomeExamAlertsSorted,
            Sort(colHomeExamAlerts, Priority, SortOrder.Ascending)
        );
